    <script>
        (function () {
            try {
                var t = localStorage.getItem('atelier_theme');
                var theme = t === 'light' ? 'light' : 'dark';
                var root = document.documentElement;
                root.dataset.theme = theme;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'light' ? '#f2efe9' : '#0a0a0d');
            } catch (e) {}
        })();
    </script>

    <style>
        html[data-theme="dark"] body {

            color: #f3f0e8;
            background: #0a0a0d;
        }

        html[data-theme="light"] body {
            margin: 0;
            color: #181715;
            background: #f2efe9;
        }

        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: var(--bg, #0a0a0d);
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        html[data-theme="light"] #preloader {
            background: #f2efe9;
        }

        #preloader.hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        <!-- Row 1: Hero Omnibar (8 cols) + Chrono & Solar Dial (4 cols) -->
        <section class="bento-card bento-hero" aria-labelledby="hero-title">
            <!-- 独立玻璃背板层，避免形成 Backdrop Root 阻断下拉面板跨卡片折射 -->
            <div class="card-glass" aria-hidden="true"></div>

            <div class="hero-header">
                <div class="hero-identity">
                    <div class="hero-avatar-frame magnetic">
                        <img src="./avatar.jpg" alt="Loong 的头像" width="72" height="72">
                        <span class="hero-presence" aria-hidden="true"></span>
                    </div>
                    <div class="hero-titles">
                        <h1 id="hero-title">Loong</h1>
                        <p id="greeting" class="hero-greeting">下午好，喝杯茶提提神</p>
                    </div>
                </div>

                <div class="quote-strip">
                    <blockquote class="quote-body">
                        <span class="quote-mark" aria-hidden="true">“</span>
                        <p id="hitokoto_text" aria-live="polite">正在为你取一句话...</p>
                    </blockquote>
                    <div class="quote-actions">
                        <button id="quote-refresh" class="quote-icon-btn" type="button" title="换一句" aria-label="换一句语录">
                            <svg class="ui-icon" aria-hidden="true"><use href="#ic-refresh"></use></svg>
                        </button>
                        <button id="quote-copy" class="quote-icon-btn" type="button" title="复制语录" aria-label="复制当前语录">
                            <svg class="ui-icon" aria-hidden="true"><use href="#ic-copy"></use></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="omnibar-wrap" id="omnibar">
                <div class="engine-bar">
                    <div class="engine-tabs" id="engine-tabs" role="tablist" aria-label="选择搜索引擎">
                        <span class="engine-glider" id="engine-glider" aria-hidden="true"><span class="glider-pill"></span></span>
                        <button class="engine-tab" type="button" role="tab" data-engine="bing" aria-selected="true"><svg class="ui-icon" aria-hidden="true"><use href="#ic-bing"></use></svg><span>Bing</span></button>
                        <button class="engine-tab" type="button" role="tab" data-engine="google" aria-selected="false"><svg class="ui-icon" aria-hidden="true"><use href="#ic-google"></use></svg><span>Google</span></button>
                        <button class="engine-tab" type="button" role="tab" data-engine="baidu" aria-selected="false"><svg class="ui-icon" aria-hidden="true"><use href="#ic-baidu"></use></svg><span>Baidu</span></button>
                        <button class="engine-tab" type="button" role="tab" data-engine="duckduckgo" aria-selected="false"><svg class="ui-icon" aria-hidden="true"><use href="#ic-ddg"></use></svg><span>DuckDuckGo</span></button>
                    </div>
                </div>

                <div class="search-anchor">
                    <div class="search-box" id="search-box" role="search">
                        <span class="search-engine-badge" aria-hidden="true">
                            <svg class="ui-icon" id="current-engine-icon" aria-hidden="true"><use href="#ic-bing"></use></svg>
                        </span>
                        <input type="search" id="search-input" placeholder="搜索、算式，或输入 / 命令..." autofocus autocomplete="off" spellcheck="false" aria-label="搜索关键词、算式或命令" aria-expanded="false" aria-controls="omni-dropdown">
                        <button id="search-clear" class="search-clear" type="button" aria-label="清空输入" hidden>
                            <svg class="ui-icon" aria-hidden="true"><use href="#ic-close"></use></svg>
                        </button>
                        <button id="search-btn" class="search-submit" type="button" aria-label="执行搜索">
                            <span aria-hidden="true">↵</span>
                        </button>
                    </div>

                    <div class="omni-dropdown" id="omni-dropdown" role="listbox" aria-label="即时计算、命令与搜索历史" hidden></div>
                </div>
            </div>
        </section>

        <section class="bento-card bento-chrono" id="clock-card" data-clock-mode="reel" aria-label="精密时钟与日照轨迹">
            <div class="chrono-head">
                <time id="readout-date" class="chrono-date">----.--.--</time>
                <span id="readout-week" class="chrono-week">星期-</span>
            </div>

            <div id="clock-display" class="clock-display" role="button" tabindex="0" title="点击切换机械滚轮 / 数码管" aria-label="当前时间，点击切换表盘样式">
                <div class="clock-reels" id="clock-reels" aria-hidden="true">
                    <div class="reel" data-slot="0"><div class="reel-strip"></div></div>
                    <div class="reel" data-slot="1"><div class="reel-strip"></div></div>
                    <span class="reel-sep">:</span>
                    <div class="reel" data-slot="2"><div class="reel-strip"></div></div>
                    <div class="reel" data-slot="3"><div class="reel-strip"></div></div>
                    <span class="reel-sep">:</span>
                    <div class="reel" data-slot="4"><div class="reel-strip"></div></div>
                    <div class="reel" data-slot="5"><div class="reel-strip"></div></div>
                </div>
                <time id="clock" class="clock-led">00:00:00</time>
            </div>

            <div class="solar-box">
                <span id="solar-phase-label" class="solar-phase">白昼运转中</span>
                <svg id="solar-dial" class="solar-dial" viewBox="0 0 280 94" role="img" aria-label="24小时日照轨迹，移动指针可预览任意时刻">
                    <defs>
                        <linearGradient id="solar-day-grad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="var(--accent-2)"></stop>
                            <stop offset="50%" stop-color="var(--accent)"></stop>
                            <stop offset="100%" stop-color="var(--accent-2)"></stop>
                        </linearGradient>
                    </defs>
                    <line class="solar-horizon" x1="12" y1="64" x2="268" y2="64"></line>
                    <path id="solar-track-full" class="solar-track-full" fill="none"></path>
                    <path id="solar-track-day" class="solar-track-day" fill="none" stroke="url(#solar-day-grad)"></path>
                    <line id="solar-guide" class="solar-guide" x1="0" y1="10" x2="0" y2="88" opacity="0"></line>
                    <g id="solar-orb" class="solar-orb">
                        <circle class="orb-halo" r="10"></circle>
                        <circle class="orb-core" r="4.5"></circle>
                    </g>
                    <text x="16" y="77" class="solar-tick">00</text>
                    <text x="78" y="77" class="solar-tick">06</text>
                    <text x="140" y="77" class="solar-tick">12</text>
                    <text x="202" y="77" class="solar-tick">18</text>
                    <text x="264" y="77" class="solar-tick">24</text>
                </svg>
            </div>

            <div class="chrono-foot">
                <span id="day-pct" class="chrono-val">今日 0%</span>
                <div class="meter-bar" aria-hidden="true"><span id="day-meter-fill"></span></div>
                <span class="chrono-year">第 <b id="year-day">---</b> 天 · <span id="year-pct">0%</span></span>
            </div>
        </section>

        <!-- Row 2: 3 Tactile 3D Portal Cards -->
        <section class="portal-row" aria-label="快捷入口">
            <a href="https://monki.de5.net" target="_blank" rel="noopener noreferrer" class="bento-card portal-card" data-portal-url="https://monki.de5.net">
                <div class="portal-glare" aria-hidden="true"></div>
                <svg class="portal-art art-blog" viewBox="0 0 120 120" aria-hidden="true">
                    <rect x="24" y="22" width="72" height="10" rx="5"></rect>
                    <rect x="24" y="44" width="54" height="8" rx="4"></rect>
                    <rect x="24" y="64" width="66" height="8" rx="4"></rect>
                    <rect x="24" y="84" width="40" height="8" rx="4"></rect>
                </svg>
                <div class="portal-top">
                    <span class="portal-url">monki.de5.net</span>
                    <span class="portal-ping" data-ping-status="pending">
                        <i class="ping-dot" aria-hidden="true"></i>

                </div>
                <div class="portal-body">

                <svg class="portal-art art-pic" viewBox="0 0 120 120" aria-hidden="true">
                    <circle cx="60" cy="60" r="38" fill="none" stroke-width="2"></circle>
                    <circle cx="60" cy="60" r="18" fill="none" stroke-width="2"></circle>

                    <line x1="14" y1="60" x2="34" y2="60" stroke-width="2"></line>
                    <line x1="86" y1="60" x2="106" y2="60" stroke-width="2"></line>
                </svg>
                <div class="portal-top">
                    <span class="portal-url">pic.soomin.de5.net</span>
                    <span class="portal-ping" data-ping-status="pending">
                        <i class="ping-dot" aria-hidden="true"></i>
                        <span class="ping-text">检测中</span>
                    </span>
                </div>
                <div class="portal-body">
                    <div class="portal-title-row">
                        <h2>个人图床</h2>
                        <svg class="ui-icon portal-arrow" aria-hidden="true"><use href="#ic-arrow-right"></use></svg>
                    </div>

            <a href="https://news.885123.xyz" target="_blank" rel="noopener noreferrer" class="bento-card portal-card" data-portal-url="https://news.885123.xyz">

                <svg class="portal-art art-news" viewBox="0 0 120 120" aria-hidden="true">

                </svg>
                <div class="portal-top">
                    <span class="portal-url">news.885123.xyz</span>
                    <span class="portal-ping" data-ping-status="pending">
                        <i class="ping-dot" aria-hidden="true"></i>
                        <span class="ping-text">检测中</span>
                    </span>
                </div>
                <div class="portal-body">
                    <div class="portal-title-row">
                        <h2>每日热点</h2>
                        <svg class="ui-icon portal-arrow" aria-hidden="true"><use href="#ic-arrow-right"></use></svg>
                    </div>
                    <p class="portal-desc">全网资讯聚合与今日风向标</p>

        <!-- Row 3: Turntable Audio Deck (5 cols) + Interactive GitHub Matrix (7 cols) -->

        <section class="bento-card bento-github" id="contrib" data-user="loong2004" aria-labelledby="github-title">

                <h2 id="github-title" class="card-title">代码足迹</h2>
                <a href="https://github.com/loong2004" target="_blank" rel="noopener noreferrer" class="gh-handle">

                <div class="network-title-row">
                    <h2 id="network-title-text" class="card-title">网络状态</h2>
                    <span id="network-summary" class="network-summary" aria-live="polite">8 个节点待检测</span>
                </div>

                <div class="network-controls">
                    <div class="net-filter-tabs" id="net-filter-tabs" role="tablist" aria-label="节点区域筛选">
                        <span class="net-glider" id="net-glider" aria-hidden="true"><span class="glider-pill"></span></span>
                        <button class="net-tab is-active" type="button" role="tab" data-region="all" aria-selected="true">全部</button>
                        <button class="net-tab" type="button" role="tab" data-region="国内" aria-selected="false">国内</button>
                        <button class="net-tab" type="button" role="tab" data-region="国际" aria-selected="false">国际</button>
                    </div>

                    <button id="net-rescan" class="icon-circle-btn" type="button" title="重新探测所有节点" aria-label="重新探测所有节点">
                        <svg class="ui-icon" aria-hidden="true"><use href="#ic-refresh"></use></svg>
                    </button>

                    <button id="network-toggle" class="network-toggle" type="button" aria-expanded="true" aria-controls="network-grid">
                        <span>收起</span>
                        <svg class="ui-icon" aria-hidden="true"><use href="#ic-chevron-up"></use></svg>
                    </button>
                </div>
            </div>

            <div class="connectivity-grid" id="network-grid"></div>
        </section>

    <!-- Floating Dynamic Mini-Island when Turntable card scrolls out of view -->

            <img id="island-cover" src="./avatar.jpg" alt="" decoding="async">
        </button>
        <div class="island-copy">
            <span id="island-title" class="island-title">黑胶唱机</span>
            <span id="island-sub" class="island-sub">等待播放</span>
        </div>
        <div class="island-actions">
            <button id="island-play" class="island-btn is-primary" type="button" aria-label="播放或暂停" title="播放 / 暂停">
                <svg class="ui-icon" aria-hidden="true"><use href="#ic-play"></use></svg>
            </button>
            <button id="island-next" class="island-btn" type="button" aria-label="下一首" title="下一首">
                <svg class="ui-icon" aria-hidden="true"><use href="#ic-next"></use></svg>
            </button>
        </div>
    </div>

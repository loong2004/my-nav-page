<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Loong 的个人工作台：搜索、导航与网络状态一站直达。">
    <meta name="theme-color" content="#151512">
    <meta name="color-scheme" content="dark">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nav.885123.xyz/">
    <meta property="og:title" content="Loong's Desk | 个人工作台">
    <meta property="og:description" content="Search less. Go further.">
    <meta property="og:image" content="./avatar.jpg">

    <title>Loong's Desk | 个人工作台</title>

    <link rel="preconnect" href="https://api.paugram.com">
    <link rel="preconnect" href="https://npm.elemecdn.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://ghchart.rshah.org">
    <link rel="preconnect" href="https://images.unsplash.com">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-sc@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
    <link rel="stylesheet" href="https://npm.elemecdn.com/aplayer/dist/APlayer.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./avatar.jpg">

    <style>
        body {
            margin: 0;
            color: #f5f3ff;
            background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 50%, #4a2c6d 100%);
        }

        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 50%, #4a2c6d 100%);
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #preloader.hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="preloader" aria-hidden="true">
        <div class="loader">
            <span class="loader-mark">L</span>
            <span class="load"></span>
        </div>
    </div>

    <canvas id="particles-canvas"></canvas>

    <main class="container">
        <nav class="topbar" aria-label="主导航">
            <div class="top-actions">
                <a href="mailto:admin@885123.xyz" class="icon-link" aria-label="发送邮件" title="Email">
                    <i class="fa-regular fa-envelope"></i>
                </a>
                <a href="https://github.com/loong2004/my-nav-page" target="_blank" rel="noopener noreferrer" class="github-star-btn">
                    <i class="fab fa-github" aria-hidden="true"></i>
                    <span>GitHub</span>
                    <span class="star-divider" aria-hidden="true"></span>
                    <i class="fa-solid fa-star star-icon" aria-hidden="true"></i>
                    <span id="github-star-count" class="star-count">SYNC</span>
                </a>
            </div>
        </nav>

        <section class="hero" id="top" aria-labelledby="hero-title">
            <figure class="profile-visual">
                <img src="./avatar.jpg" alt="Loong 的头像">
            </figure>

            <div class="hero-copy">
                <div class="hero-utility">
                    <span>SYSTEM ONLINE</span>
                    <time id="clock">00:00:00</time>
                </div>

                <h1 id="hero-title">
                    <span class="brand-name">LOONG</span>
                    <span id="greeting">你好</span>
                </h1>

                <p class="hitokoto" id="hitokoto_text" aria-live="polite">正在为你取一句话...</p>

                <div class="search-box" role="search">
                    <div class="search-engine-selector" id="engine-selector">
                        <div class="selected-engine" id="selected-engine" role="button" tabindex="0" aria-label="选择搜索引擎" aria-expanded="false" aria-controls="engine-options">
                            <i class="fab fa-microsoft" id="current-engine-icon" aria-hidden="true"></i>
                            <i class="fa-solid fa-chevron-down engine-chevron" aria-hidden="true"></i>
                        </div>
                        <div class="engine-options" id="engine-options" role="menu" aria-hidden="true">
                            <div class="option" role="menuitem" tabindex="0" data-engine="google"><i class="fab fa-google"></i><span>Google</span></div>
                            <div class="option" role="menuitem" tabindex="0" data-engine="baidu"><i class="fas fa-paw"></i><span>Baidu</span></div>
                            <div class="option" role="menuitem" tabindex="0" data-engine="bing"><i class="fab fa-microsoft"></i><span>Bing</span></div>
                            <div class="option" role="menuitem" tabindex="0" data-engine="duckduckgo"><i class="fas fa-shield-alt"></i><span>DuckDuckGo</span></div>
                        </div>
                    </div>
                    <span class="search-prompt" aria-hidden="true">&gt;</span>
                    <input type="search" id="search-input" placeholder="搜索网络..." autofocus autocomplete="off" spellcheck="false" aria-label="搜索关键词">
                    <button id="search-btn" type="button" aria-label="搜索">
                        <i class="fas fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </div>

                <div id="weather-status" class="status-line" aria-live="polite">
                    <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                    <span>正在获取天气...</span>
                </div>
            </div>
        </section>

        <section class="destinations" aria-labelledby="destinations-title">
            <div class="section-heading">
                <div>
                    <span class="section-kicker">QUICK ACCESS</span>
                    <h2 id="destinations-title">快捷入口</h2>
                </div>
                <span class="section-count">03 LINKS</span>
            </div>

            <div class="cards-grid">
                <a href="https://monki.de5.net" target="_blank" rel="noopener noreferrer" class="card card-blog">
                    <span class="card-icon"><i class="fas fa-rss" aria-hidden="true"></i></span>
                    <div class="card-copy">
                        <strong>个人博客</strong>
                        <span class="card-arrow">
                            <i class="fas fa-arrow-right" aria-hidden="true"></i>
                        </span>
                    </div>
                </a>
                <a href="https://pic.soomin.de5.net" target="_blank" rel="noopener noreferrer" class="card card-image">
                    <span class="card-icon"><i class="far fa-image" aria-hidden="true"></i></span>
                    <div class="card-copy">
                        <strong>个人图床</strong>
                        <span class="card-arrow">
                            <i class="fas fa-arrow-right" aria-hidden="true"></i>
                        </span>
                    </div>
                </a>
                <a href="https://news.885123.xyz" target="_blank" rel="noopener noreferrer" class="card card-news">
                    <span class="card-icon"><i class="far fa-newspaper" aria-hidden="true"></i></span>
                    <div class="card-copy">
                        <strong>每日热点</strong>
                        <span class="card-arrow">
                            <i class="fas fa-arrow-right" aria-hidden="true"></i>
                        </span>
                    </div>
                </a>
            </div>
        </section>

        <section class="github-section" aria-labelledby="github-title">
            <div class="section-heading compact-heading">
                <div>
                    <span class="section-kicker">CONTRIBUTIONS</span>
                    <h2 id="github-title">代码足迹</h2>
                </div>
                <a href="https://github.com/loong2004" target="_blank" rel="noopener noreferrer" class="text-link">
                    @loong2004 <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
                </a>
            </div>
            <div class="github-graph-container">
                <img src="https://ghchart.rshah.org/3dd9eb/loong2004" alt="Loong 的 GitHub 贡献图" class="gh-chart" loading="lazy" decoding="async">
            </div>
        </section>

        <section class="network-section" id="network-section" aria-labelledby="network-title-text">
            <div class="section-heading compact-heading network-title">
                <div>
                    <span class="section-kicker">LIVE STATUS</span>
                    <h2 id="network-title-text">网络监控</h2>
                </div>
                <button id="network-toggle" class="network-toggle" type="button" aria-expanded="true" aria-controls="network-grid">
                    <span>HIDE</span>
                    <i class="fas fa-chevron-up" aria-hidden="true"></i>
                </button>
            </div>
            <div id="network-summary" class="network-summary" aria-live="polite">8 个节点待检测</div>
            <div class="connectivity-grid" id="network-grid"></div>
        </section>

        <footer>
            <div class="footer-links">
                <a href="https://github.com/loong2004" target="_blank" rel="noopener noreferrer" class="footer-icon-link" aria-label="GitHub" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://t.me/loong2004" target="_blank" rel="noopener noreferrer" class="footer-icon-link" aria-label="Telegram" title="Telegram">
                    <i class="fab fa-telegram"></i>
                </a>
                <a href="mailto:admin@885123.xyz" class="footer-icon-link" aria-label="Email" title="Email">
                    <i class="fa-regular fa-envelope"></i>
                </a>
            </div>
        </footer>
    </main>

    <meting-js
        server="netease"
        type="playlist"
        id="24381616"
        fixed="true"
        mini="true"
        order="random"
        loop="all"
        preload="auto"
        list-folded="true"
        lrc-type="1">
    </meting-js>

    <script src="https://npm.elemecdn.com/aplayer/dist/APlayer.min.js"></script>
    <script src="https://npm.elemecdn.com/meting@2/dist/Meting.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
